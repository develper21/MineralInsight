version: '3.8'

services:
  # Development Frontend
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3001/api
      - VITE_DEV_MODE=true
      - VITE_DEBUG_MODE=true
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - mineral-network
    command: npm run dev

  # Development API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/mineralinsight_dev
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - mineral-network
    depends_on:
      - postgres
      - redis
    command: npm run dev

  # Development Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=mineralinsight_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - mineral-network

  # Development Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - mineral-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  mineral-network:
    driver: bridge
