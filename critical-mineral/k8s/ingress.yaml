apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mineralinsight-frontend-ingress
  namespace: mineralinsight
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - mineralinsight.com
    - www.mineralinsight.com
    secretName: mineralinsight-tls
  rules:
  - host: mineralinsight.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mineralinsight-frontend-service
            port:
              number: 80
  - host: www.mineralinsight.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mineralinsight-frontend-service
            port:
              number: 80
